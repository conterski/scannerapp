# Lint, unit tests and the browser suites on every push and pull request.
# The app itself has no build: this only runs the checks.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
      # The build for browsers without WebAssembly SIMD, which Chromium always
      # has: the detector must answer the same on it.
      - run: npx playwright test detector
        env:
          OPENCV_VARIANT: scalar
          STRICT_BASELINE: 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
