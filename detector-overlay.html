<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Detector overlay</title>
<!-- A development page, not part of the app: runs the detector on the local
     testdata/ scenes and shows what it did — the crop, the refinement's
     moves and refit attempts, and the sampled profiles across each side.
     testdata/ is not deployed, so on the live site this page shows nothing.
     Lives at the root so the worker's relative URL in detect.js resolves as
     it does for the app.

     Engines: "refined" (what the app runs) and "legacy" (its first stage).
     Baselines live in localStorage per engine: <engine>Baseline holds every
     scene's crop, <engine>PreviewRef the live outline's quad; storeBaseline
     writes both, the compare functions read them. The legacy baseline is
     also the red dashed reference on every contact sheet.

     Console API — async unless noted, `engine` defaults to "refined":
       compareEngines(engine)              every scene: the engine's crop vs the legacy baseline, receipts' IoU, timing
       storeBaseline(engine)               the engine's crops and outline quads, as the baseline to compare against
       compareToBaseline(engine)           which scenes' crops moved > 0.5% of the diagonal since storeBaseline
       previewCompare(engine)              the live outline's quad on every scene against the stored reference
       robustness(engine)                  every scene under six global changes vs its own crop (IoU) — the fragility check
       previewRobustness(engine)           the same for the live outline's quad
       scoreScene(name, quad?)             the score breakdown of a quad in the scene's own pixels (default: the legacy crop)
       showEngines(names?, height?, engine) contact sheet: the engine's crop (blue) over the legacy crop (red dashed)
       showMovers(names?, height?, engine) contact sheet over the stored baseline instead
       showVariants(pairs, engine, height) contact sheet of [scene, variant] pairs, the variant's crop over the untouched one
       showSides(pairs, engine, band?, tile?) close-ups along one side, [["fail1.jpeg","T"], ...], with the refit's located points
       packSheet(columns?, quality?)       (sync) the tiles on show as one JPEG data URL -->
<style>
  body { margin: 0; background: #14161c; color: #eceef2; font: 13px -apple-system, "Segoe UI", sans-serif; }
  header { padding: 8px 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  select, button { font: inherit; padding: 4px 8px; }
  .legend { color: #9aa1ad; font-size: 12px; }
  .scene { display: grid; grid-template-columns: auto 1fr; gap: 10px; padding: 0 14px; align-items: start; }
  .scene.sheet { display: flex; flex-wrap: wrap; }
  .scene canvas.photo { height: 640px; display: block; border-radius: 6px; }
  .side { display: grid; gap: 6px; }
  .side canvas { width: 100%; max-width: 460px; background: #0d0f13; border-radius: 4px; display: block; }
  .mono { font-family: Consolas, monospace; }
  .muted { color: #9aa1ad; }
</style>
</head>
<body>
<header>
  <strong>Detector overlay</strong>
  <select id="pick"></select>
  <button id="prev">◀</button><button id="next">▶</button>
  <select id="engine"><option value="refined">refined</option><option value="legacy">legacy</option></select>
  <span class="legend">red dashed: legacy crop · blue: the engine's crop · green dotted: ground truth · yellow/orange dots: the refit's located edge points, accepted/refused</span>
</header>
<div id="scene" class="scene"></div>

<script src="js/promise-utils.js"></script>
<script src="js/image-utils.js"></script>
<script src="js/detect.js"></script>
<script>
(function () {
  "use strict";
  const SCENES = ["fail1.jpeg","fail2.jpeg","fail3.jpeg","fail11.jpeg","fail12.jpeg","fail13.jpeg","fail14.jpeg","fail15.jpeg",
    "ok11.jpeg","ok12.jpeg","ok13.jpeg","ok14.jpeg","ok15.jpeg","hard1.jpg","hard2.jpg","hard3.jpg","hard4.jpg","hard5.jpg","hard6.jpg",
    "receipt1.jpg","receipt2.jpg","receipt3.jpg","receipt4.jpg","receipt5.jpg","receipt6.jpg","stack1.jpg","stack2.jpg","stack3.jpg","stack4.jpg","stack5.jpg",
    "samp1.jpeg","samp2.jpeg","samp3.jpeg","samp4.jpeg","samp5.jpeg","samp6.jpeg"];
  const SIDE_NAMES = ["top", "right", "bottom", "left"];
  const SIDE_LETTERS = "TRBL";
  const { CORNER_KEYS: KEYS, mapCorners, scaleCorners, quadArea } = ImageUtils;
  const KIND_COLOUR = { step: "#3b82f6", shadowStep: "#a78bfa", seam: "#22c55e", line: "#f59e0b", none: "rgba(255,255,255,.35)" };
  const COLOUR = { legacy: "#ef4444", crop: "#3b82f6", truth: "#22c55e", accepted: "rgba(253,224,71,.9)", refused: "rgba(249,115,22,.9)" };
  const DASH = { legacy: [8, 6], truth: [2, 4] };
  // The outline is judged at 1600px, the size a standard-profile frame arrives at.
  const PREVIEW_MAX_EDGE = 1600;

  const pick = document.getElementById("pick");
  const engineSelect = document.getElementById("engine");
  for (const name of SCENES) pick.appendChild(new Option(name, name));
  pick.addEventListener("change", () => show(pick.value));
  document.getElementById("prev").addEventListener("click", () => step(-1));
  document.getElementById("next").addEventListener("click", () => step(1));
  engineSelect.addEventListener("change", () => show(pick.value));

  function step(delta) {
    pick.selectedIndex = (pick.selectedIndex + delta + SCENES.length) % SCENES.length;
    show(pick.value);
  }

  // ---------------------------------------------------------------
  // Scenes, references and geometry
  // ---------------------------------------------------------------

  const decoded = new Map();
  async function canvasFor(name) {
    if (!decoded.has(name)) {
      const blob = await fetch("testdata/" + name).then((r) => r.blob());
      decoded.set(name, await ImageUtils.decodeImageToCanvas(blob, 2500));
    }
    return decoded.get(name);
  }

  let truthCache = null;
  async function groundTruth() {
    if (!truthCache) truthCache = await fetch("testdata/ground-truth.json").then((r) => r.json());
    return truthCache;
  }

  /** The hand-marked crop of a receipt scene in the canvas's pixels, or null. */
  function groundTruthQuad(truth, name, canvas) {
    const marks = name.startsWith("receipt") && truth.receipts[name.replace(/\D/g, "")];
    if (!marks) return null;
    return mapCorners(marks, ([x, y]) => ({ x: x / 100 * canvas.width, y: y / 100 * canvas.height }));
  }

  const stored = (key) => JSON.parse(localStorage.getItem(key) || "{}");
  const baselineKey = (engine) => `${engine}Baseline`;
  const previewRefKey = (engine) => `${engine}PreviewRef`;

  /** A stored baseline crop, in the scene's own pixels, or null. */
  function baselineQuad(engine, name) {
    const base = stored(baselineKey(engine))[name];
    return base ? scaleCorners(base.corners, 1 / base.scale) : null;
  }
  const legacyQuad = (name) => baselineQuad("legacy", name);

  const quadPolygon = (quad) => KEYS.map((k) => quad[k]);

  /** Sutherland–Hodgman clip of convex `subject` by convex `clipper`, in
   *  either winding: "inside" is the side the clipper's own centroid is on. */
  function clipPolygon(subject, clipper) {
    const centroid = { x: clipper.reduce((s, p) => s + p.x, 0) / clipper.length, y: clipper.reduce((s, p) => s + p.y, 0) / clipper.length };
    let output = subject;
    for (let i = 0; i < clipper.length && output.length; i++) {
      const a = clipper[i], b = clipper[(i + 1) % clipper.length];
      const input = output;
      output = [];
      const cross = (p) => (b.x - a.x) * (p.y - a.y) - (b.y - a.y) * (p.x - a.x);
      const sign = Math.sign(cross(centroid)) || 1;
      const inside = (p) => cross(p) * sign >= 0;
      const meet = (p, q) => {
        const d = (p.x - q.x) * (a.y - b.y) - (p.y - q.y) * (a.x - b.x);
        if (d === 0) return q; // p–q runs along the clip edge (two equal quads): it is all inside
        const t = ((p.x - a.x) * (a.y - b.y) - (p.y - a.y) * (a.x - b.x)) / d;
        return { x: p.x + t * (q.x - p.x), y: p.y + t * (q.y - p.y) };
      };
      for (let j = 0; j < input.length; j++) {
        const p = input[j], q = input[(j + 1) % input.length];
        if (inside(q)) { if (!inside(p)) output.push(meet(p, q)); output.push(q); }
        else if (inside(p)) output.push(meet(p, q));
      }
    }
    return output;
  }

  function polygonArea(poly) {
    return Math.abs(poly.reduce((sum, p, i) => sum + p.x * poly[(i + 1) % poly.length].y - poly[(i + 1) % poly.length].x * p.y, 0)) / 2;
  }

  /** Intersection over union of two quads. */
  function iou(a, b) {
    const clipped = clipPolygon(quadPolygon(a), quadPolygon(b));
    const shared = clipped.length ? polygonArea(clipped) : 0;
    const union = quadArea(a) + quadArea(b) - shared;
    return union > 0 ? shared / union : 0;
  }

  /** The largest corner displacement between two quads, as a percentage of `diagonal`. */
  function maxShiftPercent(a, b, diagonal) {
    return Math.max(...KEYS.map((k) => Math.hypot(a[k].x - b[k].x, a[k].y - b[k].y))) / diagonal * 100;
  }

  const round = (value, digits = 2) => (value === null || value === undefined ? "-" : (+value).toFixed(digits));
  const median = (values) => { const sorted = values.slice().sort((a, b) => a - b); return sorted[Math.floor(sorted.length / 2)]; };
  const mean = (values) => values.reduce((a, b) => a + b, 0) / values.length;

  // ---------------------------------------------------------------
  // Running the detector over the scenes
  // ---------------------------------------------------------------

  // The last full run, so contact sheets asked for the same engine reuse
  // its results rather than detecting every scene again.
  let lastRun = { engine: null, results: {} };

  /** Detects every scene (or `names`) with `engine`, calling `fn(name,
   *  canvas, result, ms)` per scene; returns the results by name. */
  async function forEachScene(engine, fn, names = SCENES) {
    await Detect.ensureOpenCV();
    const results = {};
    for (const name of names) {
      const canvas = await canvasFor(name);
      const t0 = performance.now();
      const result = await Detect.detectDebug(canvas, { engine });
      const ms = performance.now() - t0;
      results[name] = result;
      if (fn) await fn(name, canvas, result, ms);
    }
    if (names === SCENES) lastRun = { engine, results };
    return results;
  }

  async function resultFor(name, engine) {
    if (lastRun.engine === engine && lastRun.results[name]) return lastRun.results[name];
    await Detect.ensureOpenCV();
    return Detect.detectDebug(await canvasFor(name), { engine });
  }

  const previewSized = (canvas) => ImageUtils.createScaledCanvas(canvas, PREVIEW_MAX_EDGE).canvas;

  /** The live outline's quad for a scene, at the size the outline runs at,
   *  with that size. */
  async function previewQuadFor(name, engine) {
    const source = previewSized(await canvasFor(name));
    try {
      return { corners: await Detect.previewCorners(source, { engine }), width: source.width, height: source.height };
    } finally {
      ImageUtils.releaseCanvas(source);
    }
  }

  // ---------------------------------------------------------------
  // Drawing
  // ---------------------------------------------------------------

  const host = document.getElementById("scene");
  function resetHost(asSheet) {
    host.innerHTML = "";
    host.classList.toggle("sheet", asSheet);
  }

  function strokeQuad(ctx, corners, colour, width, dash) {
    if (!corners) return;
    ctx.strokeStyle = colour; ctx.lineWidth = width; ctx.setLineDash(dash); ctx.beginPath();
    KEYS.forEach((k, i) => (i ? ctx.lineTo(corners[k].x, corners[k].y) : ctx.moveTo(corners[k].x, corners[k].y)));
    ctx.closePath(); ctx.stroke(); ctx.setLineDash([]);
  }

  /**
   * One tile: a region of a scene with quads and points drawn over it.
   * @param tile { canvas, box?, height?, width?, label, reference?, truth?,
   *               crop, points?, line?, lineWidth? } — box is the region of
   *               the canvas to show (the whole canvas without); quads and
   *               points in the canvas's own pixels; height or width sets
   *               the tile's size
   */
  function sceneTile(tile) {
    const box = tile.box || { x: 0, y: 0, width: tile.canvas.width, height: tile.canvas.height };
    const scale = tile.height ? tile.height / box.height : Math.min(tile.width / box.width, tile.width / box.height);
    const view = document.createElement("canvas");
    view.className = "photo";
    view.width = Math.round(box.width * scale); view.height = Math.round(box.height * scale);
    view.style.height = view.height + "px";
    const ctx = view.getContext("2d");
    ctx.drawImage(tile.canvas, box.x, box.y, box.width, box.height, 0, 0, view.width, view.height);
    const into = (quad) => mapCorners(quad, (p) => ({ x: (p.x - box.x) * scale, y: (p.y - box.y) * scale }));
    const width = tile.lineWidth || 2;
    if (tile.truth) strokeQuad(ctx, into(tile.truth), COLOUR.truth, width, DASH.truth);
    if (tile.reference) strokeQuad(ctx, into(tile.reference), COLOUR.legacy, width, DASH.legacy);
    strokeQuad(ctx, into(tile.crop), COLOUR.crop, width + 0.5, []);
    for (const { colour, points, line } of tile.points || []) {
      ctx.fillStyle = colour;
      for (const point of points) ctx.fillRect((point.x - box.x) * scale - 2, (point.y - box.y) * scale - 2, 4, 4);
      if (line) {
        const reach = 4000;
        ctx.strokeStyle = colour; ctx.lineWidth = 1; ctx.beginPath();
        ctx.moveTo((line.px - line.dx * reach - box.x) * scale, (line.py - line.dy * reach - box.y) * scale);
        ctx.lineTo((line.px + line.dx * reach - box.x) * scale, (line.py + line.dy * reach - box.y) * scale);
        ctx.stroke();
      }
    }
    ctx.fillStyle = "#fff"; ctx.font = "bold 18px sans-serif"; ctx.fillText(tile.label, 8, 22);
    return view;
  }

  /** The refit's located edge points and fitted line for one side, in the
   *  scene's own pixels: the last pass's attempt, yellow when it moved the
   *  side and orange when it was refused. */
  function refitMarks(result, type) {
    const attempts = ((result.refinement && result.refinement.refits) || []).filter((a) => a.side === type);
    const attempt = attempts[attempts.length - 1];
    if (!attempt) return null;
    const full = (p) => ({ x: p.x / result.scale, y: p.y / result.scale });
    const line = attempt.line && { px: attempt.line.px / result.scale, py: attempt.line.py / result.scale, dx: attempt.line.dx, dy: attempt.line.dy };
    return { colour: attempt.refused ? COLOUR.refused : COLOUR.accepted, points: attempt.located.filter(Boolean).map(full), line };
  }

  /** The crop a debug result found, in the scene's own pixels. */
  const cropOf = (result) => scaleCorners(result.corners, 1 / result.scale);

  // ---------------------------------------------------------------
  // One scene
  // ---------------------------------------------------------------

  let current = null; // { name, canvas, result, truth, engine }
  let showGeneration = 0;

  async function show(name) {
    const generation = ++showGeneration;
    const engine = engineSelect.value;
    await Detect.ensureOpenCV();
    const canvas = await canvasFor(name);
    const result = await Detect.detectDebug(canvas, { engine });
    const truth = groundTruthQuad(await groundTruth(), name, canvas);
    if (generation !== showGeneration) return; // a later show() has taken over
    current = { name, canvas, result, truth, engine };
    pick.value = name;
    render(current);
  }

  function render(scene) {
    const { name, canvas, result, truth } = scene;
    resetHost(false);
    const points = [];
    for (let type = 0; type < SIDE_NAMES.length; type++) {
      const marks = refitMarks(result, type);
      if (marks) points.push(marks);
    }
    host.appendChild(sceneTile({ canvas, height: 640, label: name, reference: legacyQuad(name), truth, crop: cropOf(result), points }));
    const column = document.createElement("div");
    column.className = "side";
    column.appendChild(describe(scene));
    const strips = document.createElement("div");
    strips.className = "side";
    column.appendChild(strips);
    drawProfiles(scene, strips);
    host.appendChild(column);
  }

  function describe(scene) {
    const p = document.createElement("div");
    const r = scene.result.refinement;
    if (!r) { p.innerHTML = `<b>${scene.name}</b> · ${scene.engine} crop`; return p; }
    p.innerHTML = `<b>${scene.name}</b> · ${r.refined ? "REFINED" : "legacy kept"} · score ${round(r.scoreBefore, 3)} → ${round(r.scoreAfter, 3)} ` +
      `· print extent ${r.printExtent ? `${r.printExtent.rules} rules` : "none"}<br>` +
      `<span class="muted mono">${r.moves.map((m) => `${SIDE_NAMES[m.side][0]}${describeMove(m)}`).join(" ")}</span><br>` +
      `<span class="muted mono">refits: ${(r.refits || []).map((a) => `${SIDE_NAMES[a.side][0]} ${Math.round(a.consensus * 100)}% ${a.refused ? "✗" + a.refused : "✓" + a.inward}`).join(" · ")}</span>`;
    return p;
  }

  function describeMove(move) {
    switch (move.kind) {
      case "offset": return (move.amount > 0 ? "+" : "") + move.amount;
      case "line": return "→line" + move.amount;
      case "refit": return `refit-${move.amount}(${Math.round(move.consensus * 100)}%)`;
      default: return "∠" + move.amount;
    }
  }

  const sideTerms = (side) =>
    `E${round(side.edge)} B${round(side.background)} P${round(side.paperOutside)} C${round(side.content)} N${round(side.nested)}${side.unobserved ? " ?" : ""}`;

  /** The four sides' sampled profiles for the scene's crop, each sample
   *  coloured by its kind. */
  async function drawProfiles(scene, strips) {
    const { score } = await Detect.scoreQuad(scene.canvas, cropOf(scene.result));
    if (current !== scene) return;
    const title = document.createElement("div");
    title.className = "muted";
    title.textContent = `crop: total ${round(score.total, 3)}, geometry ${round(score.geometry)}, area ${round(score.area)}` +
      (score.paper ? `, paper L${score.paper.l} a${score.paper.a} b${score.paper.b}` : "");
    strips.appendChild(title);
    score.sides.forEach((side, type) => strips.appendChild(drawSide(side, type)));
  }

  function drawSide(side, type) {
    const plot = document.createElement("canvas");
    plot.width = 460; plot.height = 120;
    const ctx = plot.getContext("2d");
    ctx.fillStyle = "#9aa1ad"; ctx.font = "11px sans-serif";
    ctx.fillText(`${SIDE_NAMES[type]}: ${sideTerms(side)} · ${side.valid} samples${side.unobserved ? " (unobserved)" : ""}`, 4, 12);
    const samples = side.samples || [];
    if (!samples.length) return plot;
    const depths = samples[0].values.length;
    const x = (i) => 4 + (i / (depths - 1)) * 452;
    const y = (g) => 116 - (g / 255) * 96;
    // Inside is left of the centre line, outside right.
    ctx.strokeStyle = "rgba(255,255,255,.25)"; ctx.setLineDash([3, 3]); ctx.beginPath();
    ctx.moveTo(x((depths - 1) / 2), 18); ctx.lineTo(x((depths - 1) / 2), 118); ctx.stroke(); ctx.setLineDash([]);
    for (const sample of samples) {
      ctx.strokeStyle = KIND_COLOUR[sample.kind] || "#fff"; ctx.lineWidth = 1; ctx.beginPath();
      sample.values.forEach((g, i) => (i ? ctx.lineTo(x(i), y(g)) : ctx.moveTo(x(i), y(g))));
      ctx.stroke();
    }
    ctx.fillStyle = "#9aa1ad";
    ctx.fillText("in", 6, 116); ctx.fillText("out", 436, 116);
    return plot;
  }

  // ---------------------------------------------------------------
  // Console API — grading
  // ---------------------------------------------------------------

  window.scoreScene = async function (name, quad) {
    await Detect.ensureOpenCV();
    const target = quad || legacyQuad(name);
    if (!target) throw new Error(`No quad given and no legacy baseline stored — run storeBaseline("legacy") first`);
    const { score, frame } = await Detect.scoreQuad(await canvasFor(name), target);
    return {
      total: +score.total.toFixed(3), rejected: score.rejected, geometry: +score.geometry.toFixed(3), area: +score.area.toFixed(3),
      paper: score.paper, sides: score.sides.map(sideTerms), frame,
    };
  };

  window.compareEngines = async function (engine = "refined") {
    const truth = await groundTruth();
    const rows = [], times = [], receipts = [];
    await forEachScene(engine, (name, canvas, result, ms) => {
      times.push(ms);
      const legacy = legacyQuad(name);
      const crop = cropOf(result);
      const shift = legacy ? maxShiftPercent(crop, legacy, Math.hypot(canvas.width, canvas.height)) : null;
      const gt = groundTruthQuad(truth, name, canvas);
      let iouText = "";
      if (gt) {
        const after = iou(crop, gt), before = legacy ? iou(legacy, gt) : null;
        receipts.push({ before, after });
        iouText = ` IoU ${round(before, 3)}->${after.toFixed(3)}`;
      }
      const r = result.refinement;
      const detail = r ? `${r.refined ? "REFINED" : "kept"} ${round(r.scoreBefore, 3)}->${round(r.scoreAfter, 3)} ${r.moves.length} moves` : "";
      rows.push(`${name.padEnd(13)} shift ${shift === null ? "-" : shift.toFixed(1) + "%"}${iouText}  ${detail}`);
    });
    const withLegacy = receipts.filter((r) => r.before !== null);
    return {
      rows, medianMs: +median(times).toFixed(0),
      receiptsIoU: {
        before: withLegacy.length ? +mean(withLegacy.map((r) => r.before)).toFixed(3) : null,
        after: +mean(receipts.map((r) => r.after)).toFixed(3),
      },
    };
  };

  window.storeBaseline = async function (engine = "refined") {
    const baseline = {}, previewRef = {};
    await forEachScene(engine, async (name, canvas, result) => {
      baseline[name] = { corners: result.corners, scale: result.scale };
      previewRef[name] = (await previewQuadFor(name, engine)).corners;
    });
    localStorage.setItem(baselineKey(engine), JSON.stringify(baseline));
    localStorage.setItem(previewRefKey(engine), JSON.stringify(previewRef));
    return `${SCENES.length} scenes stored as ${baselineKey(engine)} and ${previewRefKey(engine)}`;
  };

  window.compareToBaseline = async function (engine = "refined") {
    const base = stored(baselineKey(engine));
    const names = Object.keys(base);
    if (!names.length) throw new Error(`No ${baselineKey(engine)} stored — run storeBaseline("${engine}") first`);
    const moved = [];
    await forEachScene(engine, (name, canvas, result) => {
      const shift = maxShiftPercent(result.corners, base[name].corners, Math.hypot(canvas.width, canvas.height) * result.scale);
      if (shift > 0.5) moved.push(`${name.padEnd(13)} max ${shift.toFixed(1)}%`);
    }, names);
    return { moved, unchanged: names.length - moved.length };
  };

  window.previewCompare = async function (engine = "refined") {
    await Detect.ensureOpenCV();
    const ref = stored(previewRefKey(engine));
    const rows = [], times = [];
    let hits = 0, same = 0;
    for (const name of SCENES) {
      const t0 = performance.now();
      const { corners, width, height } = await previewQuadFor(name, engine);
      times.push(performance.now() - t0);
      if (corners) hits++;
      const r = ref[name];
      if (!corners || !r) {
        if (!corners && !r) same++;
        else rows.push(`${name} ${corners ? "hit" : "miss"} vs reference ${r ? "hit" : "miss"}`);
        continue;
      }
      const shift = maxShiftPercent(corners, r, Math.hypot(width, height));
      if (shift <= 1.5) same++; else rows.push(`${name} ${shift.toFixed(1)}%`);
    }
    return { hits: `${hits}/${SCENES.length}`, same, differ: rows, medianMs: +median(times).toFixed(1) };
  };

  // ---------------------------------------------------------------
  // Console API — robustness: the same scene under a global change should
  // crop the same. Each variant is a canvas plus the map from original to
  // variant pixels, so the untouched crop can be compared in the variant's
  // own frame.
  // ---------------------------------------------------------------

  function filteredCopy(source, filter, scale = 1) {
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(source.width * scale);
    canvas.height = Math.round(source.height * scale);
    const ctx = canvas.getContext("2d");
    ctx.filter = filter;
    ctx.drawImage(source, 0, 0, canvas.width, canvas.height);
    return canvas;
  }

  const VARIANTS = {
    rot90: (source) => {
      const canvas = document.createElement("canvas");
      canvas.width = source.height; canvas.height = source.width;
      const ctx = canvas.getContext("2d");
      ctx.translate(canvas.width, 0); ctx.rotate(Math.PI / 2); ctx.drawImage(source, 0, 0);
      return { canvas, map: (p) => ({ x: source.height - p.y, y: p.x }) };
    },
    mirror: (source) => {
      const canvas = document.createElement("canvas");
      canvas.width = source.width; canvas.height = source.height;
      const ctx = canvas.getContext("2d");
      ctx.translate(canvas.width, 0); ctx.scale(-1, 1); ctx.drawImage(source, 0, 0);
      return { canvas, map: (p) => ({ x: source.width - p.x, y: p.y }) };
    },
    scale06: (source) => ({ canvas: filteredCopy(source, "none", 0.6), map: (p) => ({ x: p.x * 0.6, y: p.y * 0.6 }) }),
    dark: (source) => ({ canvas: filteredCopy(source, "brightness(0.65)"), map: (p) => p }),
    bright: (source) => ({ canvas: filteredCopy(source, "brightness(1.25) contrast(0.85)"), map: (p) => p }),
    blur: (source) => ({ canvas: filteredCopy(source, "blur(2px)"), map: (p) => p }),
  };

  function variantOf(source, label) {
    const make = VARIANTS[label];
    if (!make) throw new Error(`Unknown variant "${label}" — one of ${Object.keys(VARIANTS).join(", ")}`);
    return make(source);
  }

  /**
   * Every scene under every variant, compared with the scene's own
   * untouched crop: per-variant mean and minimum IoU, and the scene/variant
   * pairs below 0.9.
   * @param detectQuad async (canvas) => quad or null
   * @param prepare    (canvas) => the canvas the engine actually sees
   */
  async function variantSuite(detectQuad, prepare = (canvas) => canvas) {
    await Detect.ensureOpenCV();
    const perVariant = {};
    const weak = [];
    for (const name of SCENES) {
      const original = await canvasFor(name);
      const source = prepare(original);
      const base = await detectQuad(source);
      for (const [label, make] of Object.entries(VARIANTS)) {
        const { canvas, map } = make(source);
        const got = await detectQuad(canvas);
        const value = base && got ? iou(got, mapCorners(base, map)) : (base || got ? 0 : 1);
        (perVariant[label] = perVariant[label] || []).push(value);
        if (value < 0.9) weak.push(`${name} ${label} ${value.toFixed(3)}`);
        ImageUtils.releaseCanvas(canvas);
      }
      if (source !== original) ImageUtils.releaseCanvas(source);
    }
    const summary = {};
    for (const [label, values] of Object.entries(perVariant)) {
      summary[label] = { mean: +mean(values).toFixed(3), min: +Math.min(...values).toFixed(3), below09: values.filter((v) => v < 0.9).length };
    }
    return { summary, weak };
  }

  window.robustness = function (engine = "refined") {
    return variantSuite(async (canvas) => (await Detect.detectCorners(canvas, { engine })).corners);
  };

  /** The live outline's quad under the same variants, at the preview's own size. */
  window.previewRobustness = function (engine = "refined") {
    return variantSuite((canvas) => Detect.previewCorners(canvas, { engine }), previewSized);
  };

  // ---------------------------------------------------------------
  // Console API — contact sheets
  // ---------------------------------------------------------------

  /** A contact sheet: each scene's crop by `engine` over `referenceFor(name)`. */
  async function contactSheet(names, tileHeight, engine, referenceFor) {
    resetHost(true);
    for (const name of names) {
      const canvas = await canvasFor(name);
      const result = await resultFor(name, engine);
      host.appendChild(sceneTile({ canvas, height: tileHeight, label: name, reference: referenceFor(name), crop: cropOf(result), lineWidth: 3 }));
    }
  }

  window.showEngines = function (names, tileHeight = 300, engine = "refined") {
    return contactSheet(names || SCENES, tileHeight, engine, legacyQuad);
  };

  window.showMovers = async function (names, tileHeight = 300, engine = "refined") {
    if (!names) names = (await window.compareToBaseline(engine)).moved.map((line) => line.split(" ")[0]);
    await contactSheet(names, tileHeight, engine, (name) => baselineQuad(engine, name));
    return names;
  };

  /** A contact sheet of scene/variant pairs: the variant's crop over the untouched crop mapped in. */
  window.showVariants = async function (pairs, engine = "refined", tileHeight = 400) {
    await Detect.ensureOpenCV();
    resetHost(true);
    for (const [name, label] of pairs) {
      const source = await canvasFor(name);
      const base = (await Detect.detectCorners(source, { engine })).corners;
      const { canvas, map } = variantOf(source, label);
      const got = (await Detect.detectCorners(canvas, { engine })).corners;
      host.appendChild(sceneTile({ canvas, height: tileHeight, label: `${name} ${label}`, reference: mapCorners(base, map), crop: got, lineWidth: 3 }));
      ImageUtils.releaseCanvas(canvas);
    }
  };

  /** Close-ups: for each [scene, side letter T/R/B/L], the strip of the
   *  photo along that side of the `engine` crop, with the legacy crop and
   *  the refit's located points — `band` source px to either side of it. */
  window.showSides = async function (pairs, engine = "refined", band = 160, tileWidth = 640) {
    resetHost(true);
    for (const [name, letter] of pairs) {
      const type = SIDE_LETTERS.indexOf(letter);
      if (type < 0) throw new Error(`Side "${letter}" is not one of ${SIDE_LETTERS.split("").join(", ")}`);
      const canvas = await canvasFor(name);
      const result = await resultFor(name, engine);
      const crop = cropOf(result);
      const [a, b] = [[crop.tl, crop.tr], [crop.tr, crop.br], [crop.br, crop.bl], [crop.bl, crop.tl]][type];
      const x = Math.max(0, Math.min(a.x, b.x) - band), y = Math.max(0, Math.min(a.y, b.y) - band);
      const box = { x, y, width: Math.min(canvas.width, Math.max(a.x, b.x) + band) - x, height: Math.min(canvas.height, Math.max(a.y, b.y) + band) - y };
      const marks = refitMarks(result, type);
      host.appendChild(sceneTile({ canvas, box, width: tileWidth, label: `${name} ${letter}`, reference: legacyQuad(name), crop, points: marks ? [marks] : [] }));
    }
  };

  /** The tiles on show, packed into one JPEG data URL `columns` wide — for
   *  pulling a contact sheet out of the page in one string. */
  window.packSheet = function (columns = 3, quality = 0.5) {
    const tiles = [...host.querySelectorAll("canvas.photo")].map((canvas) => ({ canvas, width: canvas.offsetWidth, height: canvas.offsetHeight }));
    if (!tiles.length) throw new Error("Nothing on show — run a contact sheet first");
    const width = Math.max(...tiles.map((t) => t.width));
    const rowHeights = [];
    for (let i = 0; i < tiles.length; i += columns) rowHeights.push(Math.max(...tiles.slice(i, i + columns).map((t) => t.height)));
    const sheet = document.createElement("canvas");
    sheet.width = width * columns;
    sheet.height = rowHeights.reduce((sum, h) => sum + h, 0);
    const ctx = sheet.getContext("2d");
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, sheet.width, sheet.height);
    let y = 0;
    tiles.forEach((tile, i) => {
      if (i && i % columns === 0) y += rowHeights[i / columns - 1];
      ctx.drawImage(tile.canvas, (i % columns) * width, y, tile.width, tile.height);
    });
    return sheet.toDataURL("image/jpeg", quality);
  };

  show(SCENES[0]);
})();
</script>
</body>
</html>
